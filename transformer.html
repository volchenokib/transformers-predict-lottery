<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трансформер · 6 из 45</title>
<style>
:root{color-scheme:light;--paper:#f4f2ea;--card:#fffdf7;--ink:#172b26;--muted:#52635c;--line:#d7ded4;--accent:#0c624a;--soft:#e5eee3;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
main{max-width:1040px;margin:auto;padding:clamp(20px,5vw,66px)}
h1,h2,p,figure{margin:0}
h1{font-size:clamp(34px,6vw,63px);font-weight:650;letter-spacing:-.065em;line-height:1.05}
header p{margin-top:12px;color:var(--muted);font-size:15px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:26px;align-items:start}
.layout:has(.panel[hidden]) nav{width:min(100%,360px);margin:auto}
.layout:has(.panel:not([hidden])){grid-template-columns:minmax(205px,290px) minmax(0,1fr)}
nav{display:grid;gap:5px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.step{border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center;padding:10px 12px;display:grid;gap:4px;width:100%}
.encoder{margin:0;min-width:0;border:1px solid #93afa0;border-radius:14px;padding:8px 10px 10px;display:grid;gap:5px;background:var(--soft)}
.encoder legend{padding:0 7px;font-size:14px;font-weight:650;color:var(--accent)}
.result{text-align:center;font-weight:650;font-size:15px;padding:7px 0}
.step strong{font-size:15px}
.step small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}
.step[aria-pressed=true] small{color:#e1f3e9}
.arrow{color:var(--muted);text-align:center;line-height:1}
.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3.5vw,32px)}
.panel h2{font-size:clamp(23px,4vw,32px);letter-spacing:-.045em;line-height:1.1;margin-bottom:22px}
.back{background:var(--soft);color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.panel p{line-height:1.45}
.draw-picker{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
select{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.numbers{display:flex;gap:6px;flex-wrap:wrap}
.ball{display:grid;place-items:center;min-width:33px;height:33px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums}
.matrix{display:grid;grid-template-columns:repeat(45,minmax(0,1fr));gap:1px;margin-top:20px}
.matrix div{display:contents}
.matrix i{height:5px;background:#ecefe8;border-radius:1px}
.matrix i.hit{background:#519681}
.matrix div.selected i{background:#cfded3}
.matrix div.selected i.hit{background:var(--accent)}
.bits{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;margin-top:14px;font-variant-numeric:tabular-nums}
.bit{background:#f3f4ed;border-radius:4px;text-align:center;padding:4px 0}
.bit small{display:block;color:var(--muted);font-size:10px}
.bit b{font-size:13px}
.bit.hit{background:var(--soft);color:var(--accent)}
.caption{margin-top:12px;color:var(--muted);font-size:13px}
.pipeline{display:grid;gap:7px}
.stage{display:flex;align-items:center;justify-content:space-between;gap:9px;background:var(--soft);border-radius:9px;padding:12px 13px}
.stage span:last-child{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage.secondary{background:#f1f2ed}
.token-row{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin:0 0 14px}
.token-row span{height:21px;border-radius:3px;background:#dee6dc}
.token-row span:last-child{background:var(--accent)}
footer{margin-top:18px;font-size:12px}
footer a{color:var(--muted)}
@media(max-width:620px){.layout:has(.panel:not([hidden])){grid-template-columns:1fr;gap:14px}.bits{gap:2px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Трансформер · 6 из 45</h1>
    <p>Тиражи № 4853–4872 → прогноз № 4873</p>
  </header>
  <div class="layout">
    <nav aria-label="Этапы обработки">
      <button type="button" class="step" data-stage="input" aria-controls="panel" aria-pressed="false"><strong>Вход · 20 тиражей</strong><small>45 значений в каждом</small></button>
      <span class="arrow" aria-hidden="true">↓</span>
      <button type="button" class="step" data-stage="tokens" aria-controls="panel" aria-pressed="false"><strong>Входной полносвязный слой</strong><small>45 → 64, затем метка порядка</small></button>
      <span class="arrow" aria-hidden="true">↓</span>
      <fieldset class="encoder">
        <legend>Энкодер</legend>
        <button type="button" class="step" data-stage="first" aria-controls="panel" aria-pressed="false"><strong>Блок 1</strong><small>Внимание → простая сеть</small></button>
        <span class="arrow" aria-hidden="true">↓</span>
        <button type="button" class="step" data-stage="second" aria-controls="panel" aria-pressed="false"><strong>Блок 2</strong><small>Внимание → простая сеть</small></button>
      </fieldset>
      <span class="arrow" aria-hidden="true">↓</span>
      <button type="button" class="step" data-stage="output" aria-controls="panel" aria-pressed="false"><strong>Выходной полносвязный слой</strong><small>Берёт последний токен</small></button>
      <span class="arrow" aria-hidden="true">↓</span>
      <div class="result">45 оценок → 6 чисел</div>
    </nav>
    <section class="panel" id="panel" hidden>
      <button class="back" type="button" id="back">← Назад к схеме</button>
      <div id="stage-content" aria-live="polite"></div>
    </section>
  </div>
  <footer><a href="https://arxiv.org/pdf/1706.03762#page=3">Исходная схема Transformer · рис. 1</a></footer>
</main>
<script>
const draws = [[4,9,10,22,26,39],[17,18,22,38,41,45],[19,24,27,29,36,45],[1,2,16,19,25,38],[6,18,22,24,35,43],[9,12,20,21,28,45],[15,23,29,32,35,41],[1,5,13,25,30,41],[10,13,14,22,40,43],[11,15,22,23,24,35],[1,8,11,20,37,45],[7,19,26,27,28,41],[8,13,34,39,41,44],[4,8,38,39,40,41],[6,7,13,15,29,45],[1,5,6,31,33,45],[4,5,12,22,32,33],[4,6,11,21,24,32],[12,19,26,34,43,45],[19,20,37,39,42,45]];
const numbers = Array.from({length:45}, (_, index) => index + 1);
const panel = document.getElementById('panel');
const content = document.getElementById('stage-content');
let selectedDraw = 0;
const arrow = '<div class="arrow" aria-hidden="true">↓</div>';

function pipeline(rows) {
  return '<div class="pipeline">' + rows.map(([label, detail], index) =>
    '<div class="stage' + (index === 0 ? ' secondary' : '') + '"><span>' + label + '</span><span>' + detail + '</span></div>'
  ).join(arrow) + '</div>';
}

function updateDraw(index) {
  selectedDraw = index;
  const chosen = draws[index];
  document.getElementById('draw-numbers').innerHTML = chosen.map(n => '<span class="ball">'+n+'</span>').join('');
  document.getElementById('draw-matrix').innerHTML = draws.map((draw, row) =>
    '<div class="' + (row === index ? 'selected' : '') + '">' +
    numbers.map(n => '<i class="' + (draw.includes(n) ? 'hit' : '') + '"></i>').join('') + '</div>'
  ).join('');
  document.getElementById('draw-bits').innerHTML = numbers.map(n => {
    const hit = chosen.includes(n);
    return '<span class="bit' + (hit ? ' hit' : '') + '"><small>' + n + '</small><b>' + Number(hit) + '</b></span>';
  }).join('');
}

function render(key) {
  switch (key) {
    case 'input': {
      content.innerHTML = '<h2>20 тиражей по 45 значений</h2><div class="draw-picker"><label for="draw">Тираж</label><select id="draw">' +
        draws.map((_, index) => '<option value="' + index + '">№ ' + (4853 + index) + '</option>').join('') +
        '</select><div class="numbers" id="draw-numbers" aria-label="Выпавшие числа"></div></div>' +
        '<div class="matrix" id="draw-matrix" aria-hidden="true"></div>' +
        '<p class="caption">Выбранный тираж: 1 — число выпало.</p><div class="bits" id="draw-bits" aria-label="45 значений выбранного тиража"></div>';
      const select = document.getElementById('draw');
      select.value = selectedDraw;
      select.addEventListener('change', () => updateDraw(Number(select.value)));
      updateDraw(selectedDraw);
      break;
    }
    case 'tokens':
      content.innerHTML = '<h2>Один тираж → один токен</h2>' + pipeline([
        ['20 тиражей', '20 × 45'], ['Линейный слой для каждого тиража', '45 → 64'],
        ['Прибавляем вектор позиции', '20 × 64'], ['20 токенов', '20 × 64']
      ]);
      break;
    case 'first':
    case 'second':
      content.innerHTML = '<h2>Энкодер · слой ' + (key === 'first' ? 1 : 2) + '</h2>' + pipeline([
        [key === 'first' ? 'Токены на входе' : 'Выход слоя 1', '20 × 64'],
        ['Внимание между тиражами', '4 головы'], ['Сложение с входом + нормализация', '20 × 64'],
        ['Сеть для каждого токена', '64 → 128 → 64'], ['Сложение с входом сети + нормализация', '20 × 64']
      ]) + '<p class="caption">У каждого слоя свои веса.</p>';
      break;
    case 'output':
      content.innerHTML = '<h2>Как выбираем шесть чисел</h2><div class="token-row" role="img" aria-label="20 токенов, выбран последний">' +
        '<span></span>'.repeat(20) + '</div>' + pipeline([
          ['Берём токен последнего тиража', '№ 4872'],
          ['Выходной линейный слой', '64 → 45'],
          ['Берём числа с наибольшими оценками', '6 из 45']
        ]);
      break;
  }
}
document.querySelectorAll('.step').forEach(button => button.addEventListener('click', () => {
  const previous = document.querySelector('.step[aria-pressed=true]');
  previous?.setAttribute('aria-pressed', 'false');
  if (previous === button) {
    panel.hidden = true;
    return;
  }
  button.setAttribute('aria-pressed','true');
  panel.hidden = false;
  render(button.dataset.stage);
  if (matchMedia('(max-width: 620px)').matches) panel.scrollIntoView({block:'nearest'});
}));
document.getElementById('back').addEventListener('click', () => {
  const active = document.querySelector('.step[aria-pressed=true]');
  active?.setAttribute('aria-pressed', 'false');
  panel.hidden = true;
  active?.focus();
  document.querySelector('nav').scrollIntoView({block:'start'});
});
</script>
</body>
</html>
